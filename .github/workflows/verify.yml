name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix web
      - run: .venv/bin/python -m pytest -q
      - run: npm --prefix web run build
      - run: npm --prefix web run test
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm --prefix web run test:e2e
      - run: npm --prefix web run test:device
      - run: npm --prefix web run test:streamlit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            web/test-results
            web/playwright-report
            web/playwright-report-device
            web/test-results-streamlit
